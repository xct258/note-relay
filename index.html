<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全笔记中转 (全量端到端加密)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #1f2328;
      background: #ffffff;
    }
    h2 { margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #656d76; margin-bottom: 20px; }
    .row { display: flex; gap: 12px; margin-bottom: 14px; }
    .col { flex: 1; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #24292f; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #f6f8fa;
      transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    input:focus, textarea:focus {
      background: #ffffff;
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
    }
    textarea {
      height: 340px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      resize: vertical;
      line-height: 1.55;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1f883d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s ease;
    }
    button:hover { background: #1a7f37; }
    button:disabled { background: #94d3a2; cursor: not-allowed; }
    #notice {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h2>🔒 端到端全量加密中转</h2>
  <div class="subtitle">无状态安全传输模式：所有凭据与内容全程仅驻留内存，标题与正文合并 AES-256 加密后外发。</div>

  <!-- 动态认证与凭据区（每次手动输入，绝不存入本地存储） -->
  <div class="row">
    <div class="col">
      <label>1. GitHub Token (含 workflow 权限)</label>
      <input type="password" id="inputToken" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" />
    </div>
    <div class="col">
      <label>2. 加密口令 (与仓库 DECRYPT_PASSWORD 一致)</label>
      <input type="password" id="inputPass" placeholder="用于本地 AES-256 运算" autocomplete="off" />
    </div>
  </div>

  <div class="form-group">
    <label>3. 笔记标题（完全加密）</label>
    <input type="text" id="title" placeholder="如: 2026-工作总结.md" />
  </div>

  <div class="form-group">
    <label>4. Markdown 正文（完全加密）</label>
    <textarea id="content" placeholder="输入 Markdown 内容..."></textarea>
  </div>

  <button id="sendBtn" onclick="encryptAndSend()">全量加密并提交中转</button>
  <div id="notice"></div>

  <script>
    // 仓库地址配置：写死当前公开仓库即可（公开仓库名任何人可见，无安全隐患）
    // 替换为你的真实 GitHub 用户名和仓库名
    const GH_OWNER = '你的GitHub用户名'; 
    const GH_REPO = '你的公开仓库名';
    const WORKFLOW_FILE = 'forward.yml';

    // 本地原生 AES-GCM-256 加密算法
    async function encryptData(plainText, password) {
      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      const key = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );

      const cipherBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        enc.encode(plainText)
      );

      // 组装 Salt (16B) + IV (12B) + Ciphertext
      const combined = new Uint8Array(salt.byteLength + iv.byteLength + cipherBuffer.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.byteLength);
      combined.set(new Uint8Array(cipherBuffer), salt.byteLength + iv.byteLength);

      let binary = '';
      for (let i = 0; i < combined.byteLength; i++) {
        binary += String.fromCharCode(combined[i]);
      }
      return btoa(binary);
    }

    async function encryptAndSend() {
      const token = document.getElementById('inputToken').value.trim();
      const pwd = document.getElementById('inputPass').value.trim();
      const title = document.getElementById('title').value.trim() || 'note.md';
      const content = document.getElementById('content').value;
      const btn = document.getElementById('sendBtn');
      const notice = document.getElementById('notice');

      if (!token) { alert('请输入 GitHub Token！'); return; }
      if (!pwd) { alert('请输入加密口令！'); return; }
      if (!content) { alert('笔记正文不能为空！'); return; }

      btn.disabled = true;
      btn.innerText = '正在本地 AES-256 全量打包加密...';
      notice.style.display = 'none';

      try {
        // 1. 将标题、正文、时间戳打包为统一的 JSON 数据实体
        const dataPayload = JSON.stringify({
          title: title,
          content: content,
          timestamp: Date.now()
        });

        // 2. 本地执行 AES-256 加密
        const encryptedCipher = await encryptData(dataPayload, pwd);

        // 3. 提交给 GitHub Actions API
        const response = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              payload: encryptedCipher // 只有一段完全无序的 Base64 密文，网关无法提取任何特征
            }
          })
        });

        if (response.status === 204) {
          notice.style.background = '#dafbe1';
          notice.style.color = '#1a7f37';
          notice.innerText = '✅ 密文已成功外发！网关无法读取任何标题或正文。云端正在解密并写入网盘。';
          
          // 提交后清空正文与敏感密码框，保障离开工位时不泄露
          document.getElementById('content').value = '';
          document.getElementById('inputPass').value = '';
          document.getElementById('inputToken').value = '';
        } else {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }
      } catch (err) {
        notice.style.background = '#ffebe9';
        notice.style.color = '#cf222e';
        notice.innerText = `❌ 发送失败: ${err.message}`;
      } finally {
        notice.style.display = 'block';
        btn.disabled = false;
        btn.innerText = '全量加密并提交中转';
      }
    }
  </script>
</body>
</html>
