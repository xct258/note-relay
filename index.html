<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>极简云笔记</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
      --border: #d0d7de; --panel: #f6f8fa; --accent: #0969da;
      --btn: #1f883d; --btn-hover: #1a7f37; --ok-bg: #dafbe1; --ok-fg: #1a7f37;
      --err-bg: #ffebe9; --err-fg: #cf222e; --warn-bg: #fff8c5; --warn-fg: #9a6700;
      --code-bg: #f6f8fa;
    }
    [data-theme="dark"] {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
      --border: #30363d; --panel: #161b22; --accent: #2f81f7;
      --btn: #238636; --btn-hover: #2ea043;
      --ok-bg: #0f2a1a; --ok-fg: #3fb950; --err-bg: #3d0a0e; --err-fg: #f85149;
      --warn-bg: #3a2e00; --warn-fg: #d29922; --code-bg: #161b22;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 28px auto; padding: 0 16px 60px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-size: 20px; }
    .head-actions { display: flex; gap: 8px; }
    .row { display: flex; gap: 10px; } .row > * { flex: 1; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    label .hint { font-weight: 400; color: var(--muted); }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; outline: none; background: var(--panel); color: var(--fg); }
    input:focus, textarea:focus { background: var(--bg); border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(9,105,218,.15); }
    textarea { height: 340px; font-family: ui-monospace, Menlo, Consolas, monospace;
      resize: vertical; line-height: 1.55; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .toolbar button, .mini-btn {
      width: auto; padding: 7px 12px; font-size: 13px; font-weight: 600;
      background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    .toolbar button.active { border-color: var(--accent); color: var(--accent); }
    .ghost-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--fg); }
    .primary-btn { width: 100%; padding: 12px; background: var(--btn); color: #fff; border: none;
      border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .primary-btn:hover:not(:disabled) { background: var(--btn-hover); }
    .primary-btn:disabled { opacity: .6; cursor: not-allowed; }
    #notice { margin-top: 14px; padding: 12px; border-radius: 6px; display: none; font-size: 14px;
      line-height: 1.6; word-break: break-word; }
    #preview { border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px;
      min-height: 340px; display: none; line-height: 1.7; font-size: 14px; }
    #preview pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow: auto; }
    #preview code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    #preview pre code { background: none; padding: 0; }
    .stats { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .pwd-wrap { position: relative; }
    .pwd-wrap .ghost-btn { position: absolute; right: 6px; top: 6px; padding: 4px 10px; }
    .lock-card { max-width: 380px; margin: 12vh auto 0; text-align: center;
      border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; background: var(--panel); }
    .lock-emoji { font-size: 34px; }
    .lock-tip { font-size: 14px; color: var(--muted); margin: 8px 0 18px; }
    #lockMsg { margin-top: 12px; min-height: 18px; font-size: 13px; }
    .doc-list { list-style: none; padding: 0; margin: 8px 0 0; }
    .doc-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 2px; border-bottom: 1px dashed var(--border); font-size: 13px; }
    .doc-list .empty { justify-content: center; color: var(--muted); border: none; }
    .doc-name { cursor: pointer; color: var(--accent); word-break: break-all; }
    .doc-name:hover { text-decoration: underline; }
    .doc-side { color: var(--muted); font-size: 12px; white-space: nowrap; }
    @media (max-width: 640px) { .row { flex-direction: column; } textarea { height: 300px; } }
  </style>
</head>
<body>
  <header>
    <h2>📝 极简云笔记</h2>
    <div class="head-actions">
      <button class="ghost-btn" id="lockBtn" title="锁定" style="display:none">🔒 锁定</button>
      <button class="ghost-btn" id="themeBtn" title="切换明暗">🌙</button>
    </div>
  </header>

  <section id="lockView">
    <div class="lock-card">
      <div class="lock-emoji">🔒</div>
      <p class="lock-tip">请输入同步密码以访问笔记</p>
      <div class="pwd-wrap">
        <input type="password" id="unlockPass" placeholder="同步密码" autocomplete="off" />
        <button class="ghost-btn" id="togglePwd" type="button">显示</button>
      </div>
      <button class="primary-btn" id="unlockBtn" style="margin-top:14px">解锁</button>
      <div id="lockMsg"></div>
    </div>
  </section>

  <section id="appView" style="display:none">
    <div class="row">
      <div class="form-group">
        <label>📁 仓库子目录 <span class="hint">可选，如 notes/2026/09</span></label>
        <input type="text" id="folder" placeholder="notes" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>📄 笔记标题</label>
        <input type="text" id="title" placeholder="例如：2026-09-25-备忘.md" />
      </div>
    </div>

    <div class="toolbar">
      <button type="button" id="tabEdit" class="active">✏️ 编辑</button>
      <button type="button" id="tabPreview">👁️ 预览</button>
      <span style="flex:1"></span>
      <button type="button" id="btnTemplate" class="mini-btn">📝 插入模板</button>
      <button type="button" id="btnClearDraft" class="mini-btn">🧹 清草稿</button>
    </div>
    <div class="form-group" style="margin-bottom:6px">
      <textarea id="content" placeholder="输入 Markdown 正文…"></textarea>
      <div id="preview"></div>
    </div>
    <div class="stats" id="countState">0 字 · 0 行 · 约 0 分钟</div>

    <div class="form-group" style="margin-top:12px">
      <label style="font-weight:400;font-size:13px">
        <input type="checkbox" id="overwrite" checked style="width:auto" /> 允许覆盖仓库同名文件（取消则同名跳过）
        &nbsp;·&nbsp;
        <input type="checkbox" id="autoDate" checked style="width:auto" /> 空标题自动按日期命名
      </label>
    </div>

    <button class="primary-btn" id="sendBtn" onclick="processAndSend()">保存到仓库</button>
    <div id="notice"></div>

    <div class="form-group" id="docsPanel" style="margin-top:22px">
      <label>📚 仓库文档 <span class="hint" id="docsCount">加载中…</span>
        <button type="button" class="mini-btn" id="btnReloadDocs" style="float:right">刷新</button>
      </label>
      <ul id="docList" class="doc-list"></ul>
    </div>
  </section>

<script>
'use strict';
// ===== 固定配置（部署时改这里；就这一处，没有其他配置入口）=====
const GH_OWNER = 'xct258';
const GH_REPO = 'note-relay';
const GH_BRANCH = 'main';
// 同步凭证：固定写死在此，页面不提供任何修改入口
const SYNC_CREDENTIAL = 'AQAEuvCfr4FcbTM+Uep1vgo+qmAPinw8Is8GkTLeL4Jdb7JkGbYqROi3hLDbjAZPxem6O7nnNl7NtPqmF32zCx7JFZYzA10nTyTgXVkuBcxJLqFN9JHWqU3Z0WhEx1SMgqQN4EOSFTtaNErbbTSzaHu92ROzpe5x7xHY+7s3pjjb86/htLZlhlNeU+E0LA==';
const PBKDF2_ITER = 310000; // 安全参数
const COOLDOWN_SEC = 60; // 成功保存后按钮冷却秒数（防误触连点）
const MAX_PLAINTEXT = 1024 * 1024;      // 正文上限 1MB（GitHub Contents API 约 1MB 上限）

const $ = id => document.getElementById(id);
const te = new TextEncoder(), td = new TextDecoder();
let syncCred = '';   // 解锁后驻留内存的访问凭证
let docCache = [];   // 文档列表

// ---------- 主题 ----------
function initTheme() {
  const t = localStorage.getItem('nr_theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
$('themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('nr_theme', next); $('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};

$('togglePwd').onclick = () => {
  const i = $('unlockPass');
  i.type = i.type === 'password' ? 'text' : 'password';
  $('togglePwd').textContent = i.type === 'password' ? '显示' : '隐藏';
};

// ---------- 数据打包（本地处理，版本化数据包）----------
function scopePass(password, purpose) { return password + '\x00' + 'note-relay/' + purpose; }
async function makeKey(password, salt, iterations, purpose) {
  const km = await crypto.subtle.importKey('raw', te.encode(scopePass(password, purpose)),
    { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
function b64encode(u8) {
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function b64decode(b64) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
// 解析：只认约定的数据包格式，其他一律拒绝
async function unpackEnvelope(encryptedBase64, password, purpose) {
  const raw = b64decode(encryptedBase64.replace(/\s+/g, ''));
  if (raw.length <= 33 || raw[0] !== 0x01) throw new Error('数据格式不支持，请联系管理员更新同步凭证');
  const it = new DataView(raw.buffer, raw.byteOffset, raw.byteLength).getUint32(1);
  if (it !== PBKDF2_ITER) throw new Error('数据版本不匹配，请更新到最新页面');
  const salt = raw.slice(5, 21), iv = raw.slice(21, 33), ct = raw.slice(33);
  const key = await makeKey(password, salt, it, purpose);
  return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
}
function looksLikeCredential(s) {
  return /^(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghu_[A-Za-z0-9]{20,}|fine-grained)/.test(s);
}

// ---------- HTTP ----------
function ghHeaders(cred) {
  return { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${cred}`, 'Content-Type': 'application/json' };
}
async function gh(path, cred, init) {
  return fetch(`https://api.github.com${path}`, Object.assign({
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${cred}` }
  }, init || {}));
}
async function errMsg(resp) {
  try { const e = await resp.json(); return e.message || `HTTP ${resp.status}`; }
  catch { return `HTTP ${resp.status}`; }
}
function netErr(e) {
  return /Failed to fetch|NetworkError|Load failed|CORS/i.test(e.message || '')
    ? '网络/CORS 失败：请确认网络可访问 api.github.com，或换网络重试。' : e.message;
}

// ---------- 解锁 / 锁定 ----------
async function getCred(pwd) {
  const cred = (await unpackEnvelope(SYNC_CREDENTIAL, pwd, 'token')).trim();
  if (!looksLikeCredential(cred)) throw new Error('bad shape');
  return cred;
}
async function unlock() {
  const pwd = $('unlockPass').value;
  if (!pwd) { $('lockMsg').textContent = '请输入同步密码'; return; }
  const btn = $('unlockBtn');
  btn.disabled = true; btn.textContent = '解锁中…'; $('lockMsg').textContent = '';
  try {
    syncCred = await getCred(pwd);
    $('unlockPass').value = '';
    $('lockView').style.display = 'none';
    $('appView').style.display = '';
    $('lockBtn').style.display = '';
    await loadDocs();
  } catch {
    syncCred = '';
    $('lockMsg').textContent = '密码错误，无法访问';
  } finally {
    btn.disabled = false; btn.textContent = '解锁';
  }
}
function lock() {
  syncCred = ''; docCache = [];
  renderDocs();
  $('appView').style.display = 'none';
  $('lockView').style.display = '';
  $('lockBtn').style.display = 'none';
  $('lockMsg').textContent = '';
  $('unlockPass').focus();
}
$('unlockBtn').onclick = unlock;
$('lockBtn').onclick = lock;
$('unlockPass').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

// ---------- 文档列表 / 打开 / 删除 ----------
async function loadDocs() {
  if (!syncCred) return;
  const btn = $('btnReloadDocs');
  $('docsCount').textContent = '加载中…'; btn.disabled = true;
  try {
    const r = await gh(`/repos/${GH_OWNER}/${GH_REPO}/git/trees/${GH_BRANCH}?recursive=1`, syncCred);
    if (r.status === 401) throw new Error('凭证已失效，请重新解锁');
    if (!r.ok) throw new Error(await errMsg(r));
    const tree = await r.json();
    docCache = (tree.tree || []).filter(x =>
      x.type === 'blob' && /\.md$/i.test(x.path) &&
      !x.path.startsWith('.github/') && !x.path.startsWith('tools/') &&
      x.path !== 'README.md' && !x.path.endsWith('/README.md'));
    renderDocs();
  } catch (e) {
    $('docsCount').textContent = '加载失败';
    note('❌ 加载文档失败：' + netErr(e), 'err');
  } finally {
    btn.disabled = false;
  }
}
function renderDocs() {
  const ul = $('docList');
  ul.innerHTML = '';
  $('docsCount').textContent = docCache.length ? `共 ${docCache.length} 篇` : '暂无文档';
  if (!docCache.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '还没有文档，写一篇保存试试';
    ul.appendChild(li);
    return;
  }
  docCache.slice().sort((a, b) => a.path.localeCompare(b.path)).forEach(item => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'doc-name';
    name.textContent = item.path;
    name.title = `点击编辑 · ${item.size} B`;
    name.onclick = () => openDoc(item);
    li.appendChild(name);
    const side = document.createElement('span');
    side.className = 'doc-side';
    side.textContent = formatSize(item.size);
    li.appendChild(side);
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'mini-btn'; del.textContent = '删除';
    del.onclick = () => deleteDoc(item);
    li.appendChild(del);
    ul.appendChild(li);
  });
}
function formatSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
async function openDoc(item) {
  if (!syncCred) { note('请先解锁。', 'err'); return; }
  try {
    const r = await gh(`/repos/${GH_OWNER}/${GH_REPO}/contents/${apiPath(item.path)}?ref=${GH_BRANCH}`, syncCred);
    if (!r.ok) throw new Error(await errMsg(r));
    const info = await r.json();
    if (Array.isArray(info) || info.type !== 'file') throw new Error('目标不是文件');
    if (!info.content || info.encoding !== 'base64') throw new Error('文件过大，无法在页面打开');
    $('content').value = td.decode(b64decode(info.content.replace(/\s/g, '')));
    const parts = item.path.split('/'); const file = parts.pop();
    $('folder').value = parts.join('/'); $('title').value = file;
    updateCount(); refreshPreview(); saveDraft();
    switchTab('edit');
    $('content').scrollIntoView({ behavior: 'smooth', block: 'center' });
    note(`已打开 ${item.path}，修改后点「保存到仓库」即可覆盖。`, 'ok');
  } catch (e) {
    note('❌ 打开失败：' + netErr(e), 'err');
  }
}
async function deleteDoc(item) {
  if (!syncCred) { note('请先解锁。', 'err'); return; }
  if (!confirm(`确认删除「${item.path}」？会在仓库产生一次删除提交。`)) return;
  try {
    const r = await gh(`/repos/${GH_OWNER}/${GH_REPO}/contents/${apiPath(item.path)}`, syncCred, {
      method: 'DELETE',
      headers: ghHeaders(syncCred),
      body: JSON.stringify({ message: `删除笔记：${item.path}`, sha: item.sha, branch: GH_BRANCH })
    });
    if (!(r.status === 200 || r.status === 202 || r.status === 204)) throw new Error(await errMsg(r));
    note(`✅ 已删除 ${item.path}`, 'ok');
    await loadDocs();
  } catch (e) {
    note('❌ 删除失败：' + netErr(e), 'err');
  }
}
$('btnReloadDocs').onclick = loadDocs;

// ---------- 轻量 Markdown 预览（先转义防 XSS）----------
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function mdRender(src) {
  const lines = escHtml(src).split('\n');
  let html = '', inCode = false, inList = false, para = [];
  const flushPara = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const ln of lines) {
    if (/^```/.test(ln)) {
      if (inCode) { html += '</code></pre>'; inCode = false; }
      else { flushPara(); html += '<pre><code>'; inCode = true; }
      continue;
    }
    if (inCode) { html += ln + '\n'; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushPara(); if (inList) { html += '</ul>'; inList = false; }
      html += `<h${h[1].length + 2}>${inline(h[2])}</h${h[1].length + 2}>`; continue; }
    if (/^\s*---+\s*$/.test(ln)) { flushPara(); html += '<hr>'; continue; }
    if (/^\s*>\s?/.test(ln)) { flushPara(); html += `<blockquote>${inline(ln.replace(/^\s*>\s?/, ''))}</blockquote>`; continue; }
    const li = ln.match(/^\s*[-*+]\s+(.*)/);
    if (li) { flushPara(); if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (/^\s*$/.test(ln)) { flushPara(); if (inList) { html += '</ul>'; inList = false; } continue; }
    para.push(ln.trim());
  }
  flushPara(); if (inList) html += '</ul>'; if (inCode) html += '</code></pre>';
  return html || '<p style="color:var(--muted)">（空）</p>';
}
function switchTab(which) {
  const edit = which === 'edit';
  $('tabEdit').classList.toggle('active', edit); $('tabPreview').classList.toggle('active', !edit);
  $('content').style.display = edit ? 'block' : 'none';
  if (edit) { $('preview').style.display = 'none'; }
  else { $('preview').innerHTML = mdRender($('content').value); $('preview').style.display = 'block'; }
}
$('tabEdit').onclick = () => switchTab('edit');
$('tabPreview').onclick = () => switchTab('preview');

// ---------- 字数 / 草稿 / 模板 ----------
function updateCount() {
  const v = $('content').value;
  const chars = [...v].length, lines = v ? v.split('\n').length : 0;
  $('countState').textContent = `${chars} 字 · ${lines} 行 · 约 ${Math.max(1, Math.round(chars / 400))} 分钟`;
}
function refreshPreview() {
  if ($('preview').style.display === 'block') $('preview').innerHTML = mdRender($('content').value);
}
let draftTimer = null;
function saveDraft() {
  localStorage.setItem('nr_draft', JSON.stringify({
    title: $('title').value, folder: $('folder').value, content: $('content').value,
    overwrite: $('overwrite').checked, updatedAt: Date.now()
  }));
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem('nr_draft') || 'null');
    if (!d) return;
    $('title').value = d.title || ''; $('folder').value = d.folder || '';
    $('content').value = d.content || ''; $('overwrite').checked = d.overwrite !== false;
    updateCount();
  } catch { /* ignore */ }
}
['title', 'folder', 'content'].forEach(id =>
  $(id).addEventListener('input', () => {
    updateCount();
    clearTimeout(draftTimer); draftTimer = setTimeout(() => saveDraft(), 1500);
  }));
$('overwrite').addEventListener('change', () => saveDraft());
$('btnClearDraft').onclick = () => {
  localStorage.removeItem('nr_draft');
  $('title').value = ''; $('folder').value = ''; $('content').value = '';
  $('overwrite').checked = true; updateCount(); refreshPreview();
  note('草稿已清空。', 'ok');
};
$('btnTemplate').onclick = () => {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const tpl = `# ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} 记录\n\n## 待办\n\n- [ ] \n\n## 记录\n\n\n> 同步时间：${d.toLocaleString()}\n`;
  $('content').value = ($('content').value ? $('content').value.replace(/\s+$/, '') + '\n\n' : '') + tpl;
  updateCount(); saveDraft();
};

// ---------- 提示 ----------
function note(msg, kind) {
  const n = $('notice');
  n.style.display = 'block';
  n.style.background = kind === 'ok' ? 'var(--ok-bg)' : kind === 'warn' ? 'var(--warn-bg)' : 'var(--err-bg)';
  n.style.color = kind === 'ok' ? 'var(--ok-fg)' : kind === 'warn' ? 'var(--warn-fg)' : 'var(--err-fg)';
  n.textContent = msg;
}

// ---------- 保存冷却（仅成功后的防误触冷却）----------
let cooldownTimer = null;
function startCooldown(sec) {
  const btn = $('sendBtn');
  const until = Date.now() + sec * 1000;
  clearInterval(cooldownTimer);
  const tick = () => {
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(cooldownTimer);
      btn.disabled = false; btn.textContent = '保存到仓库';
    } else {
      btn.disabled = true; btn.textContent = `冷却中（${left}s 后可重发）`;
    }
  };
  tick(); cooldownTimer = setInterval(tick, 500);
}

// ---------- 路径处理 ----------
function autoTitle() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.md`;
}
function cleanSeg(s, maxLen) {
  let t = s.replace(/[\0-\x1f\x7f]/g, '').trim().replace(/^\.+/, '');
  t = [...t].map(c => (/[A-Za-z0-9._\- ]/.test(c) || (c >= '一' && c <= '鿿')) ? c : '_').join('');
  return t.replace(/\s+/g, ' ').replace(/[. ]+$/, '').trim().slice(0, maxLen);
}
function buildRepoPath(folder, title) {
  const segs = [];
  folder.replace(/\\/g, '/').split('/').forEach(p => {
    const s = cleanSeg(p, 64);
    if (s && s !== '.' && s !== '..') segs.push(s);
  });
  let name = cleanSeg(title, 100) || 'note';
  if (!name.toLowerCase().endsWith('.md')) name += '.md';
  segs.push(name);
  return segs.slice(0, 6).join('/');
}
function apiPath(repoPath) {
  return repoPath.split('/').map(encodeURIComponent).join('/');
}

// ---------- 保存到仓库 ----------
async function processAndSend() {
  if (!syncCred) { lock(); $('lockMsg').textContent = '登录已失效，请重新解锁'; return; }
  const folder = $('folder').value.trim();
  let title = $('title').value.trim();
  const content = $('content').value;
  const btn = $('sendBtn');

  if (btn.disabled) return;
  if (!content.trim()) { note('正文内容不能为空！', 'err'); return; }
  if (te.encode(content).length > MAX_PLAINTEXT) { note('正文超过 1MB 上限，请拆分保存。', 'err'); return; }
  if (!title && $('autoDate').checked) { title = autoTitle(); $('title').value = title; }
  if (!title) title = 'note.md';

  btn.disabled = true;
  btn.textContent = '正在保存…';
  note('正在处理…', 'warn');

  let saved = false;
  try {
    const repoPath = buildRepoPath(folder, title);
    const url = `/repos/${GH_OWNER}/${GH_REPO}/contents/${apiPath(repoPath)}`;
    btn.textContent = '正在检查文件…';
    let sha = null;
    const get = await gh(`${url}?ref=${GH_BRANCH}`, syncCred);
    if (get.status === 200) {
      const info = await get.json();
      if (Array.isArray(info)) throw new Error('目标路径已被同名目录占用，请换标题');
      if (!info || info.type !== 'file' || !info.sha) throw new Error('目标路径已存在且不是文件，请换标题');
      sha = info.sha;
    } else if (get.status === 401) {
      throw new Error('凭证已失效，请重新解锁');
    } else if (get.status !== 404) {
      throw new Error('检查文件失败（' + await errMsg(get) + '）');
    }
    if (sha && !$('overwrite').checked) throw new Error('文件已存在，且未允许覆盖');

    btn.textContent = '正在写入仓库…';
    const body = { message: `同步笔记：${repoPath}`, content: b64encode(te.encode(content)), branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const resp = await gh(url, syncCred, { method: 'PUT', headers: ghHeaders(syncCred), body: JSON.stringify(body) });
    if (resp.status === 200 || resp.status === 201) {
      saved = true;
      note(`✅ 保存成功！已写入仓库 ${repoPath}`, 'ok');
      $('content').value = ''; updateCount(); refreshPreview(); saveDraft();
      await loadDocs();
    } else if (resp.status === 409) {
      throw new Error('文件刚被他人改动，请重试（' + await errMsg(resp) + '）');
    } else if (resp.status === 422) {
      throw new Error('写入被拒：路径非法或内容超限（' + await errMsg(resp) + '）');
    } else if (resp.status === 401) {
      throw new Error('凭证已失效，请重新解锁（' + await errMsg(resp) + '）');
    } else if (resp.status === 403) {
      throw new Error('被限流或凭证缺少 Contents 读写权限（' + await errMsg(resp) + '）');
    } else if (resp.status === 404) {
      throw new Error('仓库或分支不存在，或凭证无权访问（' + await errMsg(resp) + '）');
    } else {
      throw new Error('保存失败（' + await errMsg(resp) + '）');
    }
  } catch (err) {
    note(`❌ ${netErr(err)}`, 'err');
  } finally {
    btn.textContent = '保存到仓库';
    if (saved) startCooldown(COOLDOWN_SEC);
    else btn.disabled = false;
  }
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && $('appView').style.display !== 'none') processAndSend();
});
initTheme(); loadDraft(); updateCount();
</script>
