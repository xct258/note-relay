<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>端到端全量加密笔记中转</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 840px; margin: 30px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #24292f; }
    .card { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; outline: none;
    }
    input:focus, textarea:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.2); }
    textarea { height: 380px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; resize: vertical; line-height: 1.5; }
    button {
      width: 100%; padding: 12px; background: #2da44e; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2c974b; }
    button:disabled { background: #94d3a2; cursor: not-allowed; }
    .toggle-cfg { font-size: 12px; color: #0969da; cursor: pointer; float: right; }
    #notice { margin-top: 14px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>
    🔒 全量加密笔记中转
    <span class="toggle-cfg" onclick="toggleConfig()">⚙️ 配置设置</span>
  </h2>

  <!-- 配置面板：支持保存在本地浏览器中，避免公开仓库中 Token 泄露 -->
  <div class="card" id="configCard" style="display: none;">
    <div class="form-group">
      <label>GitHub 用户名 / 仓库名</label>
      <input type="text" id="cfgRepo" placeholder="例如: your-name/note-relay" />
    </div>
    <div class="form-group">
      <label>GitHub Token (具备 workflow 权限)</label>
      <input type="password" id="cfgToken" placeholder="ghp_xxxx..." />
    </div>
    <div class="form-group">
      <label>解密口令 (需与 GitHub Secrets 的 DECRYPT_PASSWORD 一致)</label>
      <input type="password" id="cfgPass" placeholder="用于 AES-256 全量加密的密码" />
    </div>
    <button type="button" onclick="saveConfig()">保存配置到本地浏览器</button>
  </div>

  <div class="form-group">
    <label>笔记标题（会被完全加密）</label>
    <input type="text" id="title" placeholder="例如: 2026-09-25-学习整理.md" />
  </div>

  <div class="form-group">
    <label>Markdown 正文（会被完全加密）</label>
    <textarea id="content" placeholder="在此输入 Markdown 笔记..."></textarea>
  </div>

  <button id="sendBtn" onclick="encryptAndSendAll()">全量加密并提交中转</button>
  <div id="notice"></div>

  <script>
    // 页面加载时自动回填已存配置
    window.onload = function() {
      const repo = localStorage.getItem('relay_repo');
      const token = localStorage.getItem('relay_token');
      const pass = localStorage.getItem('relay_pass');
      if (repo) document.getElementById('cfgRepo').value = repo;
      if (token) document.getElementById('cfgToken').value = token;
      if (pass) document.getElementById('cfgPass').value = pass;

      if (!token || !repo || !pass) {
        document.getElementById('configCard').style.display = 'block';
      }
    };

    function toggleConfig() {
      const card = document.getElementById('configCard');
      card.style.display = card.style.display === 'none' ? 'block' : 'none';
    }

    function saveConfig() {
      localStorage.setItem('relay_repo', document.getElementById('cfgRepo').value.trim());
      localStorage.setItem('relay_token', document.getElementById('cfgToken').value.trim());
      localStorage.setItem('relay_pass', document.getElementById('cfgPass').value.trim());
      alert('配置已安全保存在本地浏览器！');
      toggleConfig();
    }

    // AES-GCM-256 加密
    async function encryptData(plainText, password) {
      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      const key = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );

      const cipherBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        enc.encode(plainText)
      );

      const combined = new Uint8Array(salt.byteLength + iv.byteLength + cipherBuffer.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.byteLength);
      combined.set(new Uint8Array(cipherBuffer), salt.byteLength + iv.byteLength);

      let binary = '';
      for (let i = 0; i < combined.byteLength; i++) {
        binary += String.fromCharCode(combined[i]);
      }
      return btoa(binary);
    }

    async function encryptAndSendAll() {
      const repo = localStorage.getItem('relay_repo');
      const token = localStorage.getItem('relay_token');
      const pwd = localStorage.getItem('relay_pass');
      const title = document.getElementById('title').value.trim() || 'note.md';
      const content = document.getElementById('content').value;
      const btn = document.getElementById('sendBtn');
      const notice = document.getElementById('notice');

      if (!token || !repo || !pwd) {
        alert('请先点击右上角“配置设置”补齐配置！');
        document.getElementById('configCard').style.display = 'block';
        return;
      }
      if (!content) { alert('正文不能为空！'); return; }

      btn.disabled = true;
      btn.innerText = '正在本地全量打包加密...';
      notice.style.display = 'none';

      try {
        // 关键改动：将标题与正文合并为 JSON 对象，整体加密
        const payloadObject = JSON.stringify({
          title: title,
          content: content,
          timestamp: Date.now()
        });

        const encryptedPayload = await encryptData(payloadObject, pwd);

        // 发送给 GitHub，外层参数完全不带任何真实信息
        const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/forward.yml/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              payload: encryptedPayload // 只有纯密文包
            }
          })
        });

        if (response.status === 204) {
          notice.style.background = '#dafbe1';
          notice.style.color = '#1a7f37';
          notice.innerText = '✅ 全量密文已安全发出！监控抓取到的所有字段均为乱码。GitHub Actions 正在解密还原并转存。';
          document.getElementById('content').value = '';
        } else {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }
      } catch (err) {
        notice.style.background = '#ffebe9';
        notice.style.color = '#cf222e';
        notice.innerText = `❌ 发送失败: ${err.message}`;
      } finally {
        notice.style.display = 'block';
        btn.disabled = false;
        btn.innerText = '全量加密并提交中转';
      }
    }
  </script>
</body>
</html>
