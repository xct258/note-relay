<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>极简云笔记</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
      --border: #d0d7de; --panel: #f6f8fa; --accent: #0969da;
      --btn: #1f883d; --btn-hover: #1a7f37; --ok-bg: #dafbe1; --ok-fg: #1a7f37;
      --err-bg: #ffebe9; --err-fg: #cf222e; --warn-bg: #fff8c5; --warn-fg: #9a6700;
      --code-bg: #f6f8fa;
    }
    [data-theme="dark"] {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
      --border: #30363d; --panel: #161b22; --accent: #2f81f7;
      --btn: #238636; --btn-hover: #2ea043;
      --ok-bg: #0f2a1a; --ok-fg: #3fb950; --err-bg: #3d0a0e; --err-fg: #f85149;
      --warn-bg: #3a2e00; --warn-fg: #d29922; --code-bg: #161b22;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 28px auto; padding: 0 16px 60px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h2 { margin: 0 0 18px; font-size: 20px; }
    .row { display: flex; gap: 10px; } .row > * { flex: 1; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    label .hint { font-weight: 400; color: var(--muted); }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; outline: none; background: var(--panel); color: var(--fg); }
    input:focus, textarea:focus { background: var(--bg); border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(9,105,218,.15); }
    textarea { height: 340px; font-family: ui-monospace, Menlo, Consolas, monospace;
      resize: vertical; line-height: 1.55; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .toolbar button, .mini-btn {
      width: auto; padding: 7px 12px; font-size: 13px; font-weight: 600;
      background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    .toolbar button.active { border-color: var(--accent); color: var(--accent); }
    .ghost-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--fg); }
    #sendBtn {
      width: 100%; padding: 12px; background: var(--btn); color: #fff; border: none;
      border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; }
    #sendBtn:hover:not(:disabled) { background: var(--btn-hover); }
    #sendBtn:disabled { opacity: .6; cursor: not-allowed; }
    #notice { margin-top: 14px; padding: 12px; border-radius: 6px; display: none; font-size: 14px;
      line-height: 1.6; word-break: break-word; }
    #preview { border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px;
      min-height: 340px; display: none; line-height: 1.7; font-size: 14px; }
    #preview pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow: auto; }
    #preview code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    #preview pre code { background: none; padding: 0; }
    .stats { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .pwd-wrap { position: relative; }
    .pwd-wrap .ghost-btn { position: absolute; right: 6px; top: 6px; padding: 4px 10px; }
    @media (max-width: 640px) { .row { flex-direction: column; } textarea { height: 300px; } }
  </style>
</head>
<body>
  <header>
    <h2>📝 极简云笔记</h2>
    <button class="ghost-btn" id="themeBtn" title="切换明暗">🌙</button>
  </header>

  <div class="form-group">
    <label>🔑 同步密码</label>
    <div class="pwd-wrap">
      <input type="password" id="inputPass" placeholder="输入同步密码" autocomplete="off" />
      <button class="ghost-btn" id="togglePwd" type="button">显示</button>
    </div>
    <div class="stats" id="draftState">草稿：未加载</div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>📁 网盘子目录 <span class="hint">可选，如 notes/2026/09</span></label>
      <input type="text" id="folder" placeholder="notes" autocomplete="off" />
    </div>
    <div class="form-group">
      <label>📄 笔记标题</label>
      <input type="text" id="title" placeholder="例如：2026-09-25-备忘.md" />
    </div>
  </div>

  <div class="toolbar">
    <button type="button" id="tabEdit" class="active">✏️ 编辑</button>
    <button type="button" id="tabPreview">👁️ 预览</button>
    <span style="flex:1"></span>
    <button type="button" id="btnTemplate" class="mini-btn">📝 插入模板</button>
    <button type="button" id="btnClearDraft" class="mini-btn">🧹 清草稿</button>
  </div>
  <div class="form-group" style="margin-bottom:6px">
    <textarea id="content" placeholder="输入 Markdown 正文…"></textarea>
    <div id="preview"></div>
  </div>
  <div class="stats" id="countState">0 字 · 0 行 · 约 0 分钟</div>

  <div class="form-group" style="margin-top:12px">
    <label style="font-weight:400;font-size:13px">
      <input type="checkbox" id="overwrite" checked style="width:auto" /> 允许覆盖网盘同名文件（取消则同名跳过）
      &nbsp;·&nbsp;
      <input type="checkbox" id="autoDate" checked style="width:auto" /> 空标题自动按日期命名
    </label>
  </div>

  <button id="sendBtn" onclick="processAndSend()">保存到云盘</button>
  <div id="notice"></div>

<script>
'use strict';
// ===== 固定配置（部署时改这里；就这一处，没有其他配置入口）=====
const GH_OWNER = 'xct258';
const GH_REPO = 'note-relay';
const WORKFLOW_FILE = 'forward.yml';
// 同步凭证：固定写死在此，页面不提供任何修改入口
const SYNC_CREDENTIAL = 'AQAEuvCfr4FcbTM+Uep1vgo+qmAPinw8Is8GkTLeL4Jdb7JkGbYqROi3hLDbjAZPxem6O7nnNl7NtPqmF32zCx7JFZYzA10nTyTgXVkuBcxJLqFN9JHWqU3Z0WhEx1SMgqQN4EOSFTtaNErbbTSzaHu92ROzpe5x7xHY+7s3pjjb86/htLZlhlNeU+E0LA==';
const PBKDF2_ITER = 310000; // 安全参数，前后端必须一致
const COOLDOWN_SEC = 60; // 每次保存后按钮冷却秒数（防误触；真限流靠服务端）
const MAX_PLAINTEXT = 1024 * 1024;      // 内容上限 1MB
const WARN_B64_LEN = 28000;             // 请求长度实用上限预警
const MAX_AGE_NOTE = '（服务端 15 分钟有效期，见 forward.yml）';

const $ = id => document.getElementById(id);
const te = new TextEncoder(), td = new TextDecoder();

// ---------- 主题 ----------
function initTheme() {
  const t = localStorage.getItem('nr_theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
$('themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('nr_theme', next); $('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};

$('togglePwd').onclick = () => {
  const i = $('inputPass');
  i.type = i.type === 'password' ? 'text' : 'password';
  $('togglePwd').textContent = i.type === 'password' ? '显示' : '隐藏';
};

// ---------- 数据打包（本地处理，版本化数据包）----------
function scopePass(password, purpose) { return password + '\x00' + 'note-relay/' + purpose; }
async function makeKey(password, salt, iterations, purpose) {
  const km = await crypto.subtle.importKey('raw', te.encode(scopePass(password, purpose)),
    { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function b64encode(u8) {
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function b64decode(b64) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
// 数据包格式: 0x01 | iterations u32BE | salt16 | iv12 | ct
async function packEnvelope(plainText, password, purpose) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await makeKey(password, salt, PBKDF2_ITER, purpose);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(plainText)));
  const out = new Uint8Array(1 + 4 + 16 + 12 + ct.length);
  out[0] = 0x01; new DataView(out.buffer).setUint32(1, PBKDF2_ITER);
  out.set(salt, 5); out.set(iv, 21); out.set(ct, 33);
  return b64encode(out);
}
// 解析：只认约定的数据包格式，其他一律拒绝
async function unpackEnvelope(encryptedBase64, password, purpose) {
  const raw = b64decode(encryptedBase64.replace(/\s+/g, ''));
  if (raw.length <= 33 || raw[0] !== 0x01) throw new Error('数据格式不支持，请联系管理员更新同步凭证');
  const it = new DataView(raw.buffer, raw.byteOffset, raw.byteLength).getUint32(1);
  if (it !== PBKDF2_ITER) throw new Error('数据版本不匹配，请更新到最新页面');
  const salt = raw.slice(5, 21), iv = raw.slice(21, 33), ct = raw.slice(33);
  const key = await makeKey(password, salt, it, purpose);
  return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
}
function looksLikeCredential(s) {
  return /^(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghu_[A-Za-z0-9]{20,}|fine-grained)/.test(s);
}

// ---------- 轻量 Markdown 预览（先转义防 XSS）----------
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function mdRender(src) {
  const lines = escHtml(src).split('\n');
  let html = '', inCode = false, inList = false, para = [];
  const flushPara = () => {
    if (para.length) {
      html += '<p>' + inline(para.join(' ')) + '</p>'; para = [];
    }
  };
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const ln of lines) {
    if (/^```/.test(ln)) {
      if (inCode) { html += '</code></pre>'; inCode = false; }
      else { flushPara(); html += '<pre><code>'; inCode = true; }
      continue;
    }
    if (inCode) { html += ln + '\n'; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)/);
    if (h) {
      flushPara(); if (inList) { html += '</ul>'; inList = false; }
      html += `<h${h[1].length + 2}>${inline(h[2])}</h${h[1].length + 2}>`; continue;
    }
    if (/^\s*---+\s*$/.test(ln)) { flushPara(); html += '<hr>'; continue; }
    if (/^\s*>\s?/.test(ln)) { flushPara(); html += `<blockquote>${inline(ln.replace(/^\s*>\s?/, ''))}</blockquote>`; continue; }
    const li = ln.match(/^\s*[-*+]\s+(.*)/);
    if (li) {
      flushPara(); if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(li[1])}</li>`; continue;
    }
    if (/^\s*$/.test(ln)) { flushPara(); if (inList) { html += '</ul>'; inList = false; } continue; }
    para.push(ln.trim());
  }
  flushPara(); if (inList) html += '</ul>'; if (inCode) html += '</code></pre>';
  return html || '<p style="color:var(--muted)">（空）</p>';
}
$('tabEdit').onclick = () => {
  $('tabEdit').classList.add('active'); $('tabPreview').classList.remove('active');
  $('content').style.display = 'block'; $('preview').style.display = 'none';
};
$('tabPreview').onclick = () => {
  $('tabPreview').classList.add('active'); $('tabEdit').classList.remove('active');
  $('preview').innerHTML = mdRender($('content').value);
  $('content').style.display = 'none'; $('preview').style.display = 'block';
};

// ---------- 字数 / 草稿 / 模板 ----------
function updateCount() {
  const v = $('content').value;
  const chars = [...v].length, lines = v ? v.split('\n').length : 0;
  $('countState').textContent = `${chars} 字 · ${lines} 行 · 约 ${Math.max(1, Math.round(chars / 400))} 分钟`;
}
let draftTimer = null;
function saveDraft(silent) {
  localStorage.setItem('nr_draft', JSON.stringify({
    title: $('title').value, folder: $('folder').value, content: $('content').value,
    overwrite: $('overwrite').checked, updatedAt: Date.now()
  }));
  if (!silent) $('draftState').textContent = '草稿：已保存 ' + new Date().toLocaleTimeString();
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem('nr_draft') || 'null');
    if (!d) { $('draftState').textContent = '草稿：无（仅存本机，注意隐私电脑使用）'; return; }
    $('title').value = d.title || ''; $('folder').value = d.folder || '';
    $('content').value = d.content || ''; $('overwrite').checked = d.overwrite !== false;
    $('draftState').textContent = '草稿：已恢复（' + new Date(d.updatedAt).toLocaleString() + '，仅存本机）';
    updateCount();
  } catch { /* ignore */ }
}
['title', 'folder', 'content'].forEach(id =>
  $(id).addEventListener('input', () => {
    updateCount();
    clearTimeout(draftTimer); draftTimer = setTimeout(() => saveDraft(), 1500);
  }));
$('overwrite').addEventListener('change', () => saveDraft(true));
$('btnClearDraft').onclick = () => {
  localStorage.removeItem('nr_draft');
  $('title').value = ''; $('folder').value = ''; $('content').value = ''; updateCount();
  $('draftState').textContent = '草稿：已清空'; note('草稿已清空。', 'ok');
};
$('btnTemplate').onclick = () => {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const tpl = `# ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} 记录\n\n## 待办\n\n- [ ] \n\n## 记录\n\n\n> 同步时间：${d.toLocaleString()}\n`;
  $('content').value = ($('content').value ? $('content').value.replace(/\s+$/, '') + '\n\n' : '') + tpl;
  updateCount(); saveDraft(true);
};

// ---------- 提示 ----------
function note(msg, kind, htmlUrl) {
  const n = $('notice');
  n.style.display = 'block';
  n.style.background = kind === 'ok' ? 'var(--ok-bg)' : kind === 'warn' ? 'var(--warn-bg)' : 'var(--err-bg)';
  n.style.color = kind === 'ok' ? 'var(--ok-fg)' : kind === 'warn' ? 'var(--warn-fg)' : 'var(--err-fg)';
  n.innerHTML = '';
  n.appendChild(document.createTextNode(msg));
  if (htmlUrl) {
    n.appendChild(document.createElement('br'));
    const a = document.createElement('a');
    a.href = htmlUrl; a.target = '_blank'; a.rel = 'noopener';
    a.style.color = 'inherit'; a.textContent = '查看 Actions 运行记录 ↗';
    n.appendChild(a);
  }
}

// ---------- 发送冷却（纯前端体验层；真限流在服务端）----------
let cooldownTimer = null;
function startCooldown(sec) {
  const btn = $('sendBtn');
  const until = Date.now() + sec * 1000;
  clearInterval(cooldownTimer);
  const tick = () => {
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(cooldownTimer);
      btn.disabled = false; btn.textContent = '保存到云盘';
    } else {
      btn.disabled = true; btn.textContent = `冷却中（${left}s 后可重发）`;
    }
  };
  tick();
  cooldownTimer = setInterval(tick, 500);
}

// ---------- 主流程 ----------
function autoTitle() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.md`;
}
async function gh(path, cred, init) {
  const r = await fetch(`https://api.github.com${path}`, Object.assign({
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${cred}` }
  }, init || {}));
  return r;
}
async function processAndSend() {
  const pwd = $('inputPass').value;
  const folder = $('folder').value.trim();
  let title = $('title').value.trim();
  const content = $('content').value;
  const btn = $('sendBtn');

  if (!SYNC_CREDENTIAL) { note('同步凭证缺失，请联系管理员。', 'err'); return; }
  if (!pwd) { note('请输入同步密码！', 'err'); return; }
  if (!content.trim()) { note('正文内容不能为空！', 'err'); return; }
  if (te.encode(content).length > MAX_PLAINTEXT) { note('正文超过 1MB 上限，请拆分发送。', 'err'); return; }
  if (!title && $('autoDate').checked) { title = autoTitle(); $('title').value = title; }
  if (!title) title = 'note.md';

  btn.disabled = true;
  btn.textContent = '正在打包并同步…';
  note('正在处理…', 'warn');

  let syncCred = '';
  try {
    // 1) 读取同步凭证
    try {
      syncCred = (await unpackEnvelope(SYNC_CREDENTIAL, pwd, 'token')).trim();
      if (!looksLikeCredential(syncCred)) throw new Error('bad shape');
    } catch {
      throw new Error('密码错误，同步失败！');
    }
    // 2) 打包笔记数据
    const payloadObj = JSON.stringify({
      v: 2, title, folder,
      content, overwrite: $('overwrite').checked,
      timestamp: Date.now(),
      nonce: b64encode(crypto.getRandomValues(new Uint8Array(12))).slice(0, 16)
    });
    const packedData = await packEnvelope(payloadObj, pwd, 'payload');
    if (packedData.length > WARN_B64_LEN)
      note(`数据约 ${(packedData.length / 1024).toFixed(1)}KB，接近请求长度上限，若失败请拆分正文。${MAX_AGE_NOTE}`, 'warn');

    // 3) 发送
    btn.textContent = '正在同步…';
    const resp = await gh(`/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
      syncCred, {
        method: 'POST',
        headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${syncCred}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ ref: 'main', inputs: { payload: packedData } })
      });
    if (resp.status === 204) {
      note('✅ 保存成功！已提交同步，稍后去网盘查看。', 'ok');
      $('content').value = ''; updateCount(); saveDraft(true);
      $('inputPass').value = '';
    } else {
      let msg = `HTTP ${resp.status}`;
      try { const e = await resp.json(); msg = e.message || msg; } catch {}
      if (resp.status === 401) msg = '同步凭证无效或已过期，请联系管理员更新（' + msg + '）';
      else if (resp.status === 404) msg = '仓库/Workflow 不存在，检查源码顶部配置与分支名（' + msg + '）';
      else if (resp.status === 422) msg = '参数被拒（多为数据包过大，请拆分正文）（' + msg + '）';
      else if (resp.status === 403) msg = '被限流或凭证权限不足（' + msg + '）';
      throw new Error(msg);
    }
  } catch (err) {
    const m = /Failed to fetch|NetworkError|CORS/i.test(err.message || '')
      ? '网络/CORS 失败：请确认网络可访问 api.github.com，或换网络重试。'
      : err.message;
    note(`❌ ${m}`, 'err');
  } finally {
    syncCred = ''; // 清理临时数据
    startCooldown(COOLDOWN_SEC);
  }
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') processAndSend();
});
initTheme(); loadDraft(); updateCount();
</script>
</body>
</html>
