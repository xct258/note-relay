<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全笔记中转</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 840px; margin: 30px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #24292f; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; outline: none;
    }
    input:focus, textarea:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.2); }
    textarea { height: 380px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; resize: vertical; line-height: 1.5; }
    button {
      width: 100%; padding: 12px; background: #2da44e; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2c974b; }
    button:disabled { background: #94d3a2; cursor: not-allowed; }
    #notice { margin-top: 14px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>🔒 端到端加密笔记中转</h2>

  <div class="form-group">
    <label>本地加密密钥（与 GitHub Secrets: DECRYPT_PASSWORD 一致）</label>
    <input type="password" id="cryptoKey" placeholder="输入密码，全程仅在浏览器内存运算" />
  </div>

  <div class="form-group">
    <label>笔记标题</label>
    <input type="text" id="title" placeholder="例如: 2026-09-25-学习整理.md" />
  </div>

  <div class="form-group">
    <label>Markdown 正文</label>
    <textarea id="content" placeholder="输入你的笔记正文..."></textarea>
  </div>

  <button id="sendBtn" onclick="encryptAndSend()">加密并安全提交中转</button>
  <div id="notice"></div>

  <script>
    // ===== 必填项配置 =====
    const GH_OWNER = '你的GitHub用户名';       // 修改为你的用户名
    const GH_REPO = 'note-relay';               // 修改为你的仓库名
    const WORKFLOW_ID = 'forward.yml';
    const DISPATCH_TOKEN = 'ghp_xxxxxxxxxxxx';  // 填入第二步生成的 Fine-grained Token

    // AES-GCM-256 本地加密
    async function encryptText(plainText, password) {
      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      const key = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );

      const cipherBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        enc.encode(plainText)
      );

      const combined = new Uint8Array(salt.byteLength + iv.byteLength + cipherBuffer.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.byteLength);
      combined.set(new Uint8Array(cipherBuffer), salt.byteLength + iv.byteLength);

      let binary = '';
      const len = combined.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(combined[i]);
      }
      return btoa(binary);
    }

    async function encryptAndSend() {
      const pwd = document.getElementById('cryptoKey').value.trim();
      const content = document.getElementById('content').value;
      const title = document.getElementById('title').value.trim() || 'note.md';
      const btn = document.getElementById('sendBtn');
      const notice = document.getElementById('notice');

      if (!pwd) { alert('请输入加密密码！'); return; }
      if (!content) { alert('正文不能为空！'); return; }

      btn.disabled = true;
      btn.innerText = '正在本地 AES-256 加密并外发...';
      notice.style.display = 'none';

      try {
        const encryptedPayload = await encryptText(content, pwd);

        const response = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${DISPATCH_TOKEN}`
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              title: title,
              content: encryptedPayload
            }
          })
        });

        if (response.status === 204) {
          notice.style.background = '#dafbe1';
          notice.style.color = '#1a7f37';
          notice.innerText = '✅ 提交成功！数据已以纯密文形式发出，GitHub Actions 正在云端解密并同步中转。';
          document.getElementById('content').value = '';
        } else {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }
      } catch (err) {
        notice.style.background = '#ffebe9';
        notice.style.color = '#cf222e';
        notice.innerText = `❌ 发送失败: ${err.message}`;
      } finally {
        notice.style.display = 'block';
        btn.disabled = false;
        btn.innerText = '加密并安全提交中转';
      }
    }
  </script>
</body>
</html>
