<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>云笔记</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f5;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e4e7eb;
    --border-strong: #d3d8de;
    --accent: #4f46e5;
    --accent-weak: #eef2ff;
    --accent-text: #ffffff;
    --ok: #16a34a;
    --ok-weak: #e7f6ec;
    --danger: #dc2626;
    --danger-weak: #fdecec;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-md: 0 8px 24px rgba(16,24,40,.10);
    --radius: 12px;
  }
  [data-theme="dark"] {
    --bg: #0e1014;
    --surface: #16191f;
    --surface-2: #1c2027;
    --text: #e7e9ec;
    --muted: #98a1ad;
    --border: #262b33;
    --border-strong: #333a45;
    --accent: #818cf8;
    --accent-weak: #1e2130;
    --accent-text: #0e1014;
    --ok: #4ade80;
    --ok-weak: #14251b;
    --danger: #f87171;
    --danger-weak: #2a1618;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  ::selection { background: var(--accent-weak); }
  .hidden { display: none !important; }

  /* ---------- 解锁页 ---------- */
  #lock {
    min-height: 100%; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--accent-weak), transparent 60%),
      var(--bg);
  }
  .lock-card {
    width: 100%; max-width: 380px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 18px; padding: 36px 30px;
    box-shadow: var(--shadow-md); text-align: center;
  }
  .lock-logo {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
    display: grid; place-items: center; font-size: 26px;
    background: var(--accent); color: var(--accent-text);
  }
  .lock-card h1 { margin: 0 0 6px; font-size: 19px; }
  .lock-card p { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .lock-field { position: relative; }
  .lock-field input {
    width: 100%; padding: 12px 64px 12px 14px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: var(--surface-2); outline: none;
  }
  .lock-field input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-weak); }
  .lock-field button {
    position: absolute; right: 6px; top: 6px; bottom: 6px; padding: 0 12px;
    border: none; background: transparent; color: var(--muted); border-radius: 8px;
  }
  .lock-field button:hover { color: var(--accent); }
  .lock-error { min-height: 18px; margin-top: 12px; font-size: 13px; color: var(--danger); }

  /* ---------- 通用按钮 ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-weight: 600; transition: .15s;
  }
  .btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
    border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 16px;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  /* ---------- 应用外壳 ---------- */
  #app { height: 100%; display: flex; flex-direction: column; }
  .appbar {
    height: 58px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-text); font-size: 16px;
  }
  .appbar .grow { flex: 1; }
  #menuBtn { display: none; }

  .shell { flex: 1; min-height: 0; display: flex; }

  /* ---------- 侧栏 ---------- */
  .sidebar {
    width: 300px; flex: none; display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--border); min-height: 0;
  }
  .side-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
  .side-head .row { display: flex; gap: 8px; }
  .side-head .row .btn { flex: 1; justify-content: center; }
  .search { position: relative; }
  .search input {
    width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); outline: none; font-size: 13px;
  }
  .search input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-weak); }
  .search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
  .side-list { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
  .side-foot { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

  .doc {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent; margin-bottom: 2px;
  }
  .doc:hover { background: var(--surface-2); }
  .doc.active { background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .doc .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); flex: none; }
  .doc.active .dot { background: var(--accent); }
  .doc .info { flex: 1; min-width: 0; }
  .doc .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc .del {
    border: none; background: transparent; color: var(--muted); width: 28px; height: 28px;
    border-radius: 8px; opacity: 0; transition: .15s; flex: none;
  }
  .doc:hover .del, .doc.active .del { opacity: 1; }
  .doc .del:hover { background: var(--danger-weak); color: var(--danger); }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 12px; }

  /* ---------- 主编辑区 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .editor-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; max-width: 820px; width: 100%; margin: 0 auto; padding: 20px 20px 0; }
  .doc-fields { display: flex; gap: 10px; margin-bottom: 10px; }
  .doc-fields .title-input {
    flex: 1; border: none; background: transparent; outline: none; font-size: 22px; font-weight: 700; padding: 4px 0;
  }
  .doc-fields .title-input::placeholder { color: var(--muted); font-weight: 700; }
  .doc-fields .folder-input {
    width: 200px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px;
    padding: 8px 10px; outline: none; font-size: 13px;
  }
  .doc-fields .folder-input:focus { border-color: var(--accent); background: var(--surface); }
  .editor-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .tabs button { border: none; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .tabs button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }
  .editor-bar .grow { flex: 1; }
  .editor-body { flex: 1; min-height: 0; display: flex; padding: 12px 0; }
  #editor {
    flex: 1; width: 100%; resize: none; border: none; outline: none; background: transparent;
    font: 14px/1.75 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text);
  }
  .preview {
    flex: 1; width: 100%; overflow-y: auto; padding-right: 4px; line-height: 1.8;
  }
  .preview h1, .preview h2, .preview h3, .preview h4 { margin: 20px 0 10px; line-height: 1.3; }
  .preview h1 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .preview h2 { font-size: 19px; }
  .preview h3 { font-size: 16px; }
  .preview pre { background: var(--surface-2); padding: 14px; border-radius: 10px; overflow: auto; border: 1px solid var(--border); }
  .preview code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .preview pre code { background: none; padding: 0; }
  .preview blockquote { margin: 12px 0; padding: 6px 14px; border-left: 3px solid var(--border-strong); color: var(--muted); }
  .preview hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .preview a { color: var(--accent); }

  .editor-foot {
    flex: none; border-top: 1px solid var(--border); background: var(--surface);
    padding: 10px 20px; display: flex; align-items: center; gap: 16px;
  }
  .editor-foot .grow { flex: 1; }
  .stat { font-size: 12px; color: var(--muted); }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); user-select: none; }
  .check input { accent-color: var(--accent); }
  #saveBtn { min-width: 120px; justify-content: center; }

  /* ---------- 移动端 ---------- */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; }
  @media (max-width: 780px) {
    #menuBtn { display: grid; }
    .sidebar {
      position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: 280px;
      transform: translateX(-100%); transition: transform .22s ease; box-shadow: var(--shadow-md);
    }
    .sidebar.open { transform: translateX(0); }
    .doc-fields { flex-direction: column; }
    .doc-fields .folder-input { width: 100%; }
    .editor-foot { flex-wrap: wrap; gap: 10px; }
    #saveBtn { flex: 1; }
  }

  /* ---------- Toast ---------- */
  .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    min-width: 220px; max-width: 360px; padding: 12px 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-md);
    font-size: 13px; line-height: 1.5; opacity: 0; transform: translateY(8px); transition: .25s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-left: 3px solid var(--ok); }
  .toast.err { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }
</style>
</head>
<body>
  <!-- 解锁页 -->
  <div id="lock">
    <div class="lock-card">
      <div class="lock-logo">📝</div>
      <h1>云笔记</h1>
      <p>输入同步密码以访问你的笔记</p>
      <div class="lock-field">
        <input id="lockPass" type="password" placeholder="同步密码" autocomplete="off" />
        <button id="lockPeek" type="button">显示</button>
      </div>
      <button class="btn btn-primary" id="lockGo" style="width:100%;justify-content:center;margin-top:14px">解锁</button>
      <div class="lock-error" id="lockErr"></div>
    </div>
  </div>

  <!-- 应用 -->
  <div id="app" class="hidden">
    <header class="appbar">
      <button class="icon-btn" id="menuBtn" title="文档">☰</button>
      <div class="brand"><span class="mark">📝</span><span>云笔记</span></div>
      <div class="grow"></div>
      <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
      <button class="icon-btn" id="lockNow" title="锁定">🔒</button>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="side-head">
          <div class="row">
            <button class="btn" id="newBtn">＋ 新建笔记</button>
            <button class="icon-btn" id="refreshBtn" title="刷新列表">↻</button>
          </div>
          <div class="search">
            <span class="ico">🔍</span>
            <input id="search" placeholder="搜索文档" autocomplete="off" />
          </div>
        </div>
        <div class="side-list"><ul id="docList" style="list-style:none;margin:0;padding:0"></ul></div>
        <div class="side-foot"><span id="docCount">—</span><span>GitHub</span></div>
      </aside>

      <main class="main">
        <div class="editor-shell">
          <div class="doc-fields">
            <input id="title" class="title-input" placeholder="无标题" />
            <input id="folder" class="folder-input" placeholder="子目录（可选）" autocomplete="off" />
          </div>
          <div class="editor-bar">
            <div class="tabs">
              <button class="tab active" data-view="edit">编辑</button>
              <button class="tab" data-view="preview">预览</button>
            </div>
            <div class="grow"></div>
            <button class="icon-btn" id="templateBtn" title="插入模板">📝</button>
            <button class="icon-btn" id="clearBtn" title="清空">🧹</button>
          </div>
          <div class="editor-body">
            <textarea id="editor" placeholder="开始写点什么…"></textarea>
            <div id="preview" class="preview hidden"></div>
          </div>
        </div>
        <div class="editor-foot">
          <span class="stat" id="count">0 字</span>
          <label class="check"><input type="checkbox" id="overwrite" checked /> 覆盖同名</label>
          <label class="check"><input type="checkbox" id="autoDate" checked /> 空标题按日期</label>
          <div class="grow"></div>
          <button class="btn btn-primary" id="saveBtn">保存</button>
        </div>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

<script>
'use strict';
// ===== 固定配置 =====
const GH_OWNER = 'xct258';
const GH_REPO = 'note-relay';
const GH_BRANCH = 'main';
const SYNC_CREDENTIAL = 'AQAEuvCfr4FcbTM+Uep1vgo+qmAPinw8Is8GkTLeL4Jdb7JkGbYqROi3hLDbjAZPxem6O7nnNl7NtPqmF32zCx7JFZYzA10nTyTgXVkuBcxJLqFN9JHWqU3Z0WhEx1SMgqQN4EOSFTtaNErbbTSzaHu92ROzpe5x7xHY+7s3pjjb86/htLZlhlNeU+E0LA==';
const PBKDF2_ITER = 310000;
const COOLDOWN_SEC = 60;
const MAX_PLAINTEXT = 1024 * 1024;

const $ = s => document.querySelector(s);
const te = new TextEncoder(), td = new TextDecoder();
let cred = '';
let docs = [];
let currentPath = null;

/* ---------- Toast ---------- */
function toast(msg, kind = 'info', ms = 4000) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, ms);
}

/* ---------- 数据打包 / 解析（与凭证格式保持一致）---------- */
function scopePass(pw, purpose) { return pw + '\x00' + 'note-relay/' + purpose; }
async function makeKey(pw, salt, iter, purpose) {
  const km = await crypto.subtle.importKey('raw', te.encode(scopePass(pw, purpose)), { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
function b64encode(u8) {
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function b64decode(b64) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function unpackEnvelope(b64, pw, purpose) {
  const raw = b64decode(b64.replace(/\s+/g, ''));
  if (raw.length <= 33 || raw[0] !== 0x01) throw new Error('凭证格式不支持');
  const it = new DataView(raw.buffer, raw.byteOffset, raw.byteLength).getUint32(1);
  if (it !== PBKDF2_ITER) throw new Error('凭证版本不匹配');
  const salt = raw.slice(5, 21), iv = raw.slice(21, 33), ct = raw.slice(33);
  const key = await makeKey(pw, salt, it, purpose);
  return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
}
function looksLikeCredential(s) {
  return /^(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghu_[A-Za-z0-9]{20,})/.test(s);
}

/* ---------- GitHub API ---------- */
function ghHeaders() {
  return { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${cred}`, 'Content-Type': 'application/json' };
}
async function gh(path, init) {
  return fetch('https://api.github.com' + path, Object.assign({
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${cred}` }
  }, init || {}));
}
async function errMsg(resp) {
  try { const e = await resp.json(); return e.message || ('HTTP ' + resp.status); }
  catch { return 'HTTP ' + resp.status; }
}
function netErr(e) {
  return /Failed to fetch|NetworkError|Load failed|CORS/i.test(e.message || '')
    ? '网络异常，请检查网络后重试' : e.message;
}

/* ---------- 主题 ---------- */
function initTheme() {
  const t = localStorage.getItem('nr_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(t);
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('nr_theme', t);
  $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------- 解锁 / 锁定 ---------- */
function lockMsg(t) { $('#lockErr').textContent = t || ''; }
$('#lockPeek').onclick = () => {
  const i = $('#lockPass');
  i.type = i.type === 'password' ? 'text' : 'password';
  $('#lockPeek').textContent = i.type === 'password' ? '显示' : '隐藏';
};
async function unlock() {
  const pw = $('#lockPass').value;
  if (!pw) { lockMsg('请输入密码'); return; }
  const btn = $('#lockGo');
  btn.disabled = true; btn.textContent = '解锁中…'; lockMsg('');
  try {
    const c = (await unpackEnvelope(SYNC_CREDENTIAL, pw, 'token')).trim();
    if (!looksLikeCredential(c)) throw new Error('凭证无效');
    cred = c;
    $('#lockPass').value = '';
    $('#lock').classList.add('hidden');
    $('#app').classList.remove('hidden');
    await loadDocs();
  } catch {
    cred = '';
    lockMsg('密码错误，无法访问');
  } finally {
    btn.disabled = false; btn.textContent = '解锁';
  }
}
function lockNow() {
  cred = ''; docs = []; currentPath = null; $('#search').value = '';
  renderDocs();
  $('#app').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  lockMsg('');
  $('#lockPass').focus();
}
$('#lockGo').onclick = unlock;
$('#lockNow').onclick = lockNow;
$('#lockPass').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

/* ---------- 文档列表 ---------- */
async function loadDocs() {
  const btn = $('#refreshBtn');
  $('#docCount').textContent = '加载中…'; btn.disabled = true;
  try {
    const r = await gh(`/repos/${GH_OWNER}/${GH_REPO}/git/trees/${GH_BRANCH}?recursive=1`);
    if (r.status === 401) throw new Error('凭证失效');
    if (!r.ok) throw new Error(await errMsg(r));
    const tree = await r.json();
    docs = (tree.tree || []).filter(x =>
      x.type === 'blob' && /\.md$/i.test(x.path) &&
      !x.path.startsWith('.github/') && !x.path.startsWith('tools/') &&
      x.path !== 'README.md' && !x.path.endsWith('/README.md'));
    renderDocs();
  } catch (e) {
    $('#docCount').textContent = '加载失败';
    toast('加载文档失败：' + netErr(e), 'err');
  } finally {
    btn.disabled = false;
  }
}
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function renderDocs() {
  const q = $('#search').value.trim().toLowerCase();
  const list = docs.filter(d => !q || d.path.toLowerCase().includes(q))
    .sort((a, b) => a.path.localeCompare(b.path));
  $('#docCount').textContent = docs.length ? `${list.length}/${docs.length} 篇` : '暂无文档';
  const ul = $('#docList');
  ul.innerHTML = '';
  if (!list.length) {
    const div = document.createElement('li');
    div.className = 'empty';
    div.textContent = docs.length ? '没有匹配的文档' : '还没有文档，点「新建笔记」开始';
    ul.appendChild(div);
    return;
  }
  for (const d of list) {
    const li = document.createElement('li');
    li.className = 'doc' + (d.path === currentPath ? ' active' : '');
    const dot = document.createElement('span'); dot.className = 'dot';
    const info = document.createElement('div'); info.className = 'info';
    const parts = d.path.split('/'); const name = parts.pop();
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
    const sub = document.createElement('div'); sub.className = 'sub';
    sub.textContent = (parts.length ? parts.join('/') + '/ · ' : '') + fmtSize(d.size);
    info.append(nm, sub);
    const del = document.createElement('button'); del.className = 'del'; del.title = '删除'; del.textContent = '🗑';
    del.onclick = e => { e.stopPropagation(); deleteDoc(d); };
    li.append(dot, info, del);
    li.onclick = () => openDoc(d);
    ul.appendChild(li);
  }
}
$('#refreshBtn').onclick = loadDocs;
$('#search').addEventListener('input', renderDocs);

/* ---------- 打开 / 删除 ---------- */
async function openDoc(d) {
  try {
    const r = await gh(`/repos/${GH_OWNER}/${GH_REPO}/contents/${apiPath(d.path)}?ref=${GH_BRANCH}`);
    if (!r.ok) throw new Error(await errMsg(r));
    const info = await r.json();
    if (Array.isArray(info) || info.type !== 'file') throw new Error('目标不是文件');
    if (!info.content || info.encoding !== 'base64') throw new Error('文件过大，无法打开');
    $('#editor').value = td.decode(b64decode(info.content.replace(/\s/g, '')));
    setFields(d.path);
    currentPath = d.path;
    updateCount(); saveDraft(); switchView('edit'); renderDocs();
    toast('已打开 ' + d.path, 'ok', 2500);
  } catch (e) {
    toast('打开失败：' + netErr(e), 'err');
  }
}
async function deleteDoc(d) {
  if (!confirm(`删除「${d.path}」？会在仓库产生一次删除提交。`)) return;
  try {
    const r = await gh(`/repos/${GH_OWNER}/${GH_REPO}/contents/${apiPath(d.path)}`, {
      method: 'DELETE', headers: ghHeaders(),
      body: JSON.stringify({ message: `删除笔记：${d.path}`, sha: d.sha, branch: GH_BRANCH })
    });
    if (!(r.status === 200 || r.status === 202 || r.status === 204)) throw new Error(await errMsg(r));
    if (currentPath === d.path) newNote(false);
    toast('已删除 ' + d.path, 'ok');
    await loadDocs();
  } catch (e) {
    toast('删除失败：' + netErr(e), 'err');
  }
}

/* ---------- 编辑器 ---------- */
function setFields(path) {
  const parts = path.split('/'); const file = parts.pop();
  $('#title').value = file; $('#folder').value = parts.join('/');
}
function newNote(refresh = true) {
  currentPath = null;
  $('#title').value = ''; $('#folder').value = ''; $('#editor').value = '';
  updateCount(); switchView('edit');
  if (refresh) { saveDraft(); renderDocs(); }
  $('#title').focus();
}
$('#newBtn').onclick = () => { newNote(); closeSidebar(); };

function switchView(v) {
  const edit = v === 'edit';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('#editor').classList.toggle('hidden', !edit);
  $('#preview').classList.toggle('hidden', edit);
  if (!edit) $('#preview').innerHTML = mdRender($('#editor').value);
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchView(b.dataset.view));
function refreshPreview() { if (!$('#preview').classList.contains('hidden')) $('#preview').innerHTML = mdRender($('#editor').value); }

function updateCount() {
  const v = $('#editor').value;
  const chars = [...v].length, lines = v ? v.split('\n').length : 0;
  $('#count').textContent = `${chars} 字 · ${lines} 行 · 约 ${Math.max(1, Math.round(chars / 400))} 分钟`;
}

/* ---------- 草稿 ---------- */
let draftTimer = null;
function saveDraft() {
  localStorage.setItem('nr_draft', JSON.stringify({
    title: $('#title').value, folder: $('#folder').value, content: $('#editor').value,
    overwrite: $('#overwrite').checked, updatedAt: Date.now()
  }));
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem('nr_draft') || 'null');
    if (!d) return;
    $('#title').value = d.title || ''; $('#folder').value = d.folder || '';
    $('#editor').value = d.content || ''; $('#overwrite').checked = d.overwrite !== false;
    updateCount();
  } catch { /* ignore */ }
}
['title', 'folder', 'editor'].forEach(id =>
  $('#' + id).addEventListener('input', () => { updateCount(); clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 1200); }));
$('#overwrite').addEventListener('change', saveDraft);
$('#clearBtn').onclick = () => {
  localStorage.removeItem('nr_draft');
  $('#title').value = ''; $('#folder').value = ''; $('#editor').value = ''; $('#overwrite').checked = true;
  currentPath = null; updateCount(); refreshPreview(); renderDocs();
  toast('已清空', 'info', 2000);
};
$('#templateBtn').onclick = () => {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const tpl = `# ${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} 记录\n\n## 待办\n\n- [ ] \n\n## 记录\n\n\n> 同步时间：${d.toLocaleString()}\n`;
  $('#editor').value = ($('#editor').value ? $('#editor').value.replace(/\s+$/, '') + '\n\n' : '') + tpl;
  updateCount(); saveDraft();
};

/* ---------- Markdown 预览 ---------- */
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function mdRender(src) {
  const lines = escHtml(src).split('\n');
  let html = '', inCode = false, inList = false, para = [];
  const flush = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const ln of lines) {
    if (/^```/.test(ln)) { if (inCode) { html += '</code></pre>'; inCode = false; } else { flush(); html += '<pre><code>'; inCode = true; } continue; }
    if (inCode) { html += ln + '\n'; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)/);
    if (h) { flush(); if (inList) { html += '</ul>'; inList = false; } html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (/^\s*---+\s*$/.test(ln)) { flush(); html += '<hr>'; continue; }
    if (/^\s*>\s?/.test(ln)) { flush(); html += `<blockquote>${inline(ln.replace(/^\s*>\s?/, ''))}</blockquote>`; continue; }
    const li = ln.match(/^\s*[-*+]\s+(.*)/);
    if (li) { flush(); if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (/^\s*$/.test(ln)) { flush(); if (inList) { html += '</ul>'; inList = false; } continue; }
    para.push(ln.trim());
  }
  flush(); if (inList) html += '</ul>'; if (inCode) html += '</code></pre>';
  return html || '<p style="color:var(--muted)">（空）</p>';
}

/* ---------- 路径 ---------- */
function autoTitle() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.md`;
}
function cleanSeg(s, max) {
  let t = s.replace(/[\0-\x1f\x7f]/g, '').trim().replace(/^\.+/, '');
  t = [...t].map(c => (/[A-Za-z0-9._\- ]/.test(c) || (c >= '一' && c <= '鿿')) ? c : '_').join('');
  return t.replace(/\s+/g, ' ').replace(/[. ]+$/, '').trim().slice(0, max);
}
function buildPath(folder, title) {
  const segs = [];
  folder.replace(/\\/g, '/').split('/').forEach(p => { const s = cleanSeg(p, 64); if (s && s !== '.' && s !== '..') segs.push(s); });
  let name = cleanSeg(title, 100) || 'note';
  if (!name.toLowerCase().endsWith('.md')) name += '.md';
  segs.push(name);
  return segs.slice(0, 6).join('/');
}
function apiPath(p) { return p.split('/').map(encodeURIComponent).join('/'); }

/* ---------- 保存 ---------- */
let cooling = false;
function startCooldown(sec) {
  const btn = $('#saveBtn'); cooling = true;
  const until = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) { cooling = false; btn.disabled = false; btn.textContent = '保存'; }
    else { btn.disabled = true; btn.textContent = `冷却 ${left}s`; }
  };
  tick(); const t = setInterval(() => { if (!cooling) clearInterval(t); else tick(); }, 500);
}
$('#saveBtn').onclick = save;
async function save() {
  if (!cred) { lockNow(); return; }
  if (cooling || $('#saveBtn').disabled) return;
  const content = $('#editor').value;
  if (!content.trim()) { toast('正文内容不能为空', 'err'); return; }
  if (te.encode(content).length > MAX_PLAINTEXT) { toast('正文超过 1MB，请拆分保存', 'err'); return; }
  let title = $('#title').value.trim();
  if (!title && $('#autoDate').checked) { title = autoTitle(); $('#title').value = title; }
  if (!title) title = 'note.md';
  const folder = $('#folder').value.trim();

  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    const path = buildPath(folder, title);
    const url = `/repos/${GH_OWNER}/${GH_REPO}/contents/${apiPath(path)}`;
    let sha = null;
    const get = await gh(`${url}?ref=${GH_BRANCH}`);
    if (get.status === 200) {
      const info = await get.json();
      if (Array.isArray(info)) throw new Error('目标路径已被同名目录占用');
      if (!info || info.type !== 'file' || !info.sha) throw new Error('目标路径已存在且不是文件');
      sha = info.sha;
    } else if (get.status === 401) { throw new Error('凭证失效，请重新解锁'); }
    else if (get.status !== 404) { throw new Error('检查文件失败：' + await errMsg(get)); }
    if (sha && !$('#overwrite').checked) throw new Error('文件已存在，未允许覆盖');

    const body = { message: `同步笔记：${path}`, content: b64encode(te.encode(content)), branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const resp = await gh(url, { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
    if (resp.status === 200 || resp.status === 201) {
      toast('已保存到仓库 · ' + path, 'ok');
      $('#editor').value = ''; updateCount(); refreshPreview(); saveDraft();
      currentPath = path; setFields(path); await loadDocs();
      startCooldown(COOLDOWN_SEC);
    } else if (resp.status === 409) { throw new Error('文件刚被改动，请重试'); }
    else if (resp.status === 422) { throw new Error('写入被拒：路径非法或内容超限'); }
    else if (resp.status === 401) { throw new Error('凭证失效，请重新解锁'); }
    else if (resp.status === 403) { throw new Error('被限流或凭证缺少权限'); }
    else if (resp.status === 404) { throw new Error('仓库或分支不存在，或无权访问'); }
    else { throw new Error('保存失败：' + await errMsg(resp)); }
  } catch (e) {
    toast(netErr(e), 'err');
  } finally {
    if (!cooling) { btn.disabled = false; btn.textContent = '保存'; }
  }
}

/* ---------- 移动端侧栏 ---------- */
function openSidebar() { $('#sidebar').classList.add('open'); $('#backdrop').classList.remove('hidden'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.add('hidden'); }
$('#menuBtn').onclick = openSidebar;
(function () {
  const bd = document.createElement('div');
  bd.id = 'backdrop'; bd.className = 'hidden';
  bd.onclick = closeSidebar;
  document.body.appendChild(bd);
})();

/* ---------- 快捷键 ---------- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !$('#app').classList.contains('hidden')) { e.preventDefault(); save(); }
});

initTheme(); loadDraft(); updateCount();
</script>
