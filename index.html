<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简中转笔记</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 820px;
      margin: 30px auto;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1f2328;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #24292f; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #f6f8fa;
    }
    input:focus, textarea:focus {
      background: #ffffff;
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
    }
    textarea { height: 380px; font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; line-height: 1.5; }
    button {
      width: 100%;
      padding: 12px;
      background: #1f883d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1a7f37; }
    button:disabled { background: #94d3a2; cursor: not-allowed; }
    #notice { margin-top: 14px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🔒 极简端到端加密笔记</h2>
  <div style="font-size: 13px; color: #656d76; margin-bottom: 18px;">
    无需登录，无需输入 Token，仅凭唯一口令解密凭据并全量加密外发。
  </div>

  <div class="form-group">
    <label>🔑 唯一密钥口令 (Password)</label>
    <input type="password" id="inputPass" placeholder="输入口令，回车或点击提交" autocomplete="off" />
  </div>

  <div class="form-group">
    <label>笔记标题</label>
    <input type="text" id="title" placeholder="例如: 2026-工作备忘.md" />
  </div>

  <div class="form-group">
    <label>Markdown 正文</label>
    <textarea id="content" placeholder="输入你的 Markdown 笔记正文..."></textarea>
  </div>

  <button id="sendBtn" onclick="processAndSend()">全量加密并提交中转</button>
  <div id="notice"></div>

  <script>
    // ===== 仓库公开配置 =====
    const GH_OWNER = 'xct258';       // 你的用户名
    const GH_REPO = 'note-relay';           // 你的仓库名
    const WORKFLOW_FILE = 'forward.yml';

    // 把第一步临时脚本打印出来的【Token密文串】填入这里（公开无害，无法暴力破解）
    const ENCRYPTED_TOKEN_BLOB = '这里粘贴第一步生成的长串密文';

    // --- Web Crypto 加解密工具库 ---
    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // 本地解密 Token
    async function decryptToken(encryptedBase64, password) {
      const raw = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
      const salt = raw.slice(0, 16);
      const iv = raw.slice(16, 28);
      const ciphertext = raw.slice(28);

      const key = await deriveKey(password, salt);
      const decBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        ciphertext
      );
      return new TextDecoder().decode(decBuffer);
    }

    // 本地全量加密 (标题 + 正文)
    async function encryptPayload(plainText, password) {
      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);

      const cipherBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        enc.encode(plainText)
      );

      const combined = new Uint8Array(salt.byteLength + iv.byteLength + cipherBuffer.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.byteLength);
      combined.set(new Uint8Array(cipherBuffer), salt.byteLength + iv.byteLength);

      let binary = '';
      for (let i = 0; i < combined.byteLength; i++) binary += String.fromCharCode(combined[i]);
      return btoa(binary);
    }

    // 提交处理主逻辑
    async function processAndSend() {
      const pwd = document.getElementById('inputPass').value.trim();
      const title = document.getElementById('title').value.trim() || 'note.md';
      const content = document.getElementById('content').value;
      const btn = document.getElementById('sendBtn');
      const notice = document.getElementById('notice');

      if (!pwd) { alert('请输入密钥口令！'); return; }
      if (!content) { alert('正文内容不能为空！'); return; }

      btn.disabled = true;
      btn.innerText = '正在本地核验密钥并打包加密...';
      notice.style.display = 'none';

      try {
        // 1. 用口令在本地内存中瞬间解密出真实的 GitHub Token
        let realToken = '';
        try {
          realToken = await decryptToken(ENCRYPTED_TOKEN_BLOB, pwd);
          if (!realToken.startsWith('ghp_') && !realToken.startsWith('github_pat_')) {
            throw new Error('Invalid token structure');
          }
        } catch (e) {
          throw new Error('口令错误，无法解密认证凭据！');
        }

        // 2. 用相同口令全量打包加密标题与正文
        const payloadObject = JSON.stringify({
          title: title,
          content: content,
          timestamp: Date.now()
        });
        const encryptedPayload = await encryptPayload(payloadObject, pwd);

        // 3. 向 GitHub Actions 派发运行任务
        btn.innerText = '正在中转发送...';
        const response = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${realToken}`
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: { payload: encryptedPayload }
          })
        });

        if (response.status === 204) {
          notice.style.background = '#dafbe1';
          notice.style.color = '#1a7f37';
          notice.innerText = '✅ 发送成功！数据已全量加密送出，后台正在同步至网盘。';
          // 清空输入内容和密码框
          document.getElementById('content').value = '';
          document.getElementById('inputPass').value = '';
        } else {
          const errData = await response.json();
          throw new Error(errData.message || `HTTP ${response.status}`);
        }
      } catch (err) {
        notice.style.background = '#ffebe9';
        notice.style.color = '#cf222e';
        notice.innerText = `❌ ${err.message}`;
      } finally {
        notice.style.display = 'block';
        btn.disabled = false;
        btn.innerText = '全量加密并提交中转';
      }
    }
  </script>
</body>
</html>
