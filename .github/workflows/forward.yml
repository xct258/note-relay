name: Decrypt Package and Upload to WebDAV

on:
  workflow_dispatch:
    inputs:
      payload:
        description: '全量 Base64 密文包'
        required: true

jobs:
  decrypt-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install cryptography

      - name: Decrypt Package
        env:
          ENCRYPTED_PAYLOAD: ${{ github.event.inputs.payload }}
          PASSWORD: ${{ secrets.DECRYPT_PASSWORD }}
        run: |
          python3 -c "
          import os, base64, json
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes

          raw = base64.b64decode(os.environ['ENCRYPTED_PAYLOAD'])
          salt, iv, ciphertext = raw[:16], raw[16:28], raw[28:]

          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = kdf.derive(os.environ['PASSWORD'].encode())
          aesgcm = AESGCM(key)
          decrypted_str = aesgcm.decrypt(iv, ciphertext, None).decode('utf-8')

          data = json.loads(decrypted_str)
          title = data.get('title', 'note.md').strip()
          content = data.get('content', '')

          safe_title = ''.join(c if c.isalnum() or c in '._- ' else '_' for c in title)
          if not safe_title.endswith('.md'):
              safe_title += '.md'

          with open('note.md', 'w', encoding='utf-8') as f:
              f.write(content)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'FINAL_TITLE={safe_title}\n')
          "

      - name: Upload to WebDAV
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          TARGET="${WEBDAV_URL}${FINAL_TITLE}"
          echo "正在上传至: $TARGET"

          # 自动跟随 301/302，并打印 HTTP 头排查状态
          curl -i -L --fail-with-body \
            -u "$WEBDAV_USER:$WEBDAV_PASSWORD" \
            -T note.md \
            "$TARGET"

          echo "✅ 上传成功！"
