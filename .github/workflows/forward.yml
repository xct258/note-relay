name: Decrypt and Upload to openlist WebDAV

on:
  workflow_dispatch:
    inputs:
      title:
        description: '笔记文件名'
        required: true
        default: 'note.md'
      content:
        description: 'Base64 密文'
        required: true

jobs:
  decrypt-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Cryptography
        run: pip install cryptography

      - name: Decrypt Payload
        env:
          ENCRYPTED_DATA: ${{ github.event.inputs.content }}
          PASSWORD: ${{ secrets.DECRYPT_PASSWORD }}
        run: |
          python3 -c "
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes

          raw = base64.b64decode(os.environ['ENCRYPTED_DATA'])
          salt, iv, ciphertext = raw[:16], raw[16:28], raw[28:]

          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = kdf.derive(os.environ['PASSWORD'].encode())

          aesgcm = AESGCM(key)
          plaintext = aesgcm.decrypt(iv, ciphertext, None).decode('utf-8')

          with open('decrypted_note.md', 'w', encoding='utf-8') as f:
              f.write(plaintext)
          "

      - name: Upload to WebDAV
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          NOTE_TITLE: ${{ github.event.inputs.title }}
        run: |
          # 确保文件名安全，去除特殊空格或斜杠
          SAFE_FILENAME=$(echo "${NOTE_TITLE:-note.md}" | tr ' /' '_-')
          
          # 确保后缀为 .md
          if [[ "$SAFE_FILENAME" != *.md ]]; then
            SAFE_FILENAME="${SAFE_FILENAME}.md"
          fi

          echo "正在上传至 openlist: ${WEBDAV_URL}${SAFE_FILENAME}"

          # 上传文件至 openlist WebDAV
          curl --fail -sS -X PUT \
            -u "$WEBDAV_USER:$WEBDAV_PASSWORD" \
            -T decrypted_note.md \
            "${WEBDAV_URL}${SAFE_FILENAME}"

          echo "✅ 上传成功！"
